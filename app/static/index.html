<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntentForge | Commercial Lead Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#090d16] text-slate-100 font-sans min-h-screen antialiased">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-[#090d16]/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">INTENTFORGE</span>
                <span class="text-xs px-2 py-0.5 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded">Live Commercial Engine</span>
            </div>
            <button onclick="fetchLeads()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-black font-semibold rounded text-sm transition">
                Sync Live Leads
            </button>
        </div>
    </header>

    <!-- Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-white">Live Client Adverts & Task Feed</h1>
                <p class="text-sm text-slate-400">Harvested commercial intent with zero developer noise.</p>
            </div>
            <div id="lead-count" class="text-emerald-400 font-bold text-lg">Loading leads...</div>
        </div>

        <!-- Leads Grid -->
        <div id="leads-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-full text-center py-12 text-slate-500 animate-pulse">
                Fetching leads from /api/v1/inbound/live...
            </div>
        </div>
    </main>

    <script>
        async function fetchLeads() {
            const container = document.getElementById('leads-container');
            container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 animate-pulse">Syncing fresh commercial leads...</div>`;

            try {
                const response = await fetch('/api/v1/inbound/live');
                const data = await response.json();

                if (data.status === 'success' && data.leads) {
                    document.getElementById('lead-count').innerText = `${data.leads.length} Verified Leads`;
                    renderLeads(data.leads);
                } else {
                    container.innerHTML = `<div class="col-span-full text-center py-12 text-red-400">No leads available or error in feed response.</div>`;
                }
            } catch (error) {
                console.error("Error fetching leads:", error);
                container.innerHTML = `<div class="col-span-full text-center py-12 text-red-400">Failed to connect to backend endpoint.</div>`;
            }
        }

        function renderLeads(leads) {
            const container = document.getElementById('leads-container');
            if (!leads || leads.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-slate-900 border border-slate-800 rounded-xl">
                        <div class="text-slate-400 text-lg">No active commercial leads found.</div>
                        <p class="text-sm text-slate-500 mt-2">The background scanner is polling live sources.</p>
                    </div>`;
                return;
            }

            container.innerHTML = leads.map(lead => `
                <div class="bg-slate-900 border border-slate-800 hover:border-emerald-500/50 rounded-xl p-6 transition flex flex-col justify-between shadow-xl">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-2.5 py-1 bg-slate-800 text-emerald-400 border border-slate-700 text-xs font-semibold rounded">${lead.domain || 'Commercial Intent'}</span>
                            <span class="text-xs text-slate-500">${lead.created_at || ''}</span>
                        </div>
                        <h2 class="text-lg font-bold text-white mb-2 line-clamp-2">${lead.title}</h2>
                        <p class="text-slate-400 text-sm mb-4 line-clamp-3">${lead.snippet}</p>
                    </div>
                    <div>
                        <div class="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-lg p-3 mb-4">
                            <div>
                                <div class="text-[10px] uppercase text-slate-500 font-semibold">Client Budget</div>
                                <div class="text-emerald-400 font-bold text-base">$${lead.price}</div>
                            </div>
                        </div>
                        <a href="${lead.source}" target="_blank" class="w-full block text-center py-2.5 bg-slate-800 hover:bg-emerald-600 hover:text-black text-slate-200 font-semibold rounded-lg text-sm transition">
                            View Advert &rarr;
                        </a>
                    </div>
                </div>
            `).join('');
        }

        fetchLeads();
    </script>
</body>
</html>
