<script>
    const API_ENDPOINT = '/api/v1/inbound/live';
    const PAYSTACK_PUBLIC_KEY = 'pk_live_xxxxxxxxxxxxxxxxxxxxxxxx'; 

    async function fetchLiveLeads() {
        try {
            document.getElementById('lead-count').innerText = "Fetching...";
            const response = await fetch(API_ENDPOINT);
            const result = await response.json();

            if (result.status === 'success' && result.data) {
                document.getElementById('lead-count').innerText = result.count;
                renderLeads(result.data);
            } else {
                document.getElementById('lead-count').innerText = "0";
            }
        } catch (err) {
            console.error('Failed to load live leads:', err);
            document.getElementById('lead-count').innerText = "Error";
        }
    }

    function renderLeads(leads) {
        const container = document.getElementById('leads-grid');
        container.innerHTML = '';

        if (!leads || leads.length === 0) {
            container.innerHTML = '<div class="col-span-full p-6 bg-slate-900 border border-slate-800 rounded-xl text-center text-slate-400">Sweeping live developer streams... New leads will appear shortly.</div>';
            return;
        }

        leads.forEach(lead => {
            const card = document.createElement('div');
            card.className = 'flex flex-col justify-between p-6 bg-slate-900/80 border border-slate-800 hover:border-slate-700 rounded-xl transition duration-200 shadow-lg';

            card.innerHTML = `
                <div>
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-xs font-medium px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700">
                            ${escapeHtml(lead.domain)}
                        </span>
                        <span class="text-xs font-mono text-slate-500">
                            ${lead.created_at ? lead.created_at.split(' ')[1] || '' : ''} UTC
                        </span>
                    </div>
                    <h3 class="text-lg font-semibold text-slate-100 mb-2 leading-snug">
                        ${escapeHtml(lead.title)}
                    </h3>
                    <p class="text-slate-400 text-xs sm:text-sm line-clamp-3 mb-4 leading-relaxed">
                        ${escapeHtml((lead.snippet || '').replace(/<[^>]*>?/gm, ''))}
                    </p>
                </div>

                <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between mt-2">
                    <div>
                        <span class="text-xs text-slate-500 block">Remediation Patch</span>
                        <span class="text-xl font-extrabold text-emerald-400">$${lead.price}.00</span>
                    </div>
                    <button onclick="triggerCheckout('${lead.task_hash}', ${lead.price}, '${escapeHtml(lead.title)}')" 
                            class="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-lg transition duration-150 shadow-md">
                        Unlock Playbook →
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function triggerCheckout(taskHash, price, title) {
        const email = prompt("Enter your email address to receive the playbook:");
        if (!email || !email.includes('@')) {
            alert("A valid email address is required for instant fulfillment.");
            return;
        }

        const handler = PaystackPop.setup({
            key: PAYSTACK_PUBLIC_KEY,
            email: email,
            amount: price * 100 * 1600, // Converted to NGN kobo equivalent
            currency: 'NGN',
            metadata: {
                custom_fields: [
                    { display_name: "Task Hash", variable_name: "task_hash", value: taskHash },
                    { display_name: "Issue Title", variable_name: "issue_title", value: title }
                ]
            },
            callback: function(response) {
                alert("Payment received! Reference: " + response.reference + ". Your playbook is dispatching to your inbox.");
            },
            onClose: function() {
                console.log('Payment popup closed.');
            }
        });
        handler.openIframe();
    }

    function escapeHtml(str) {
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : '';
    }

    // Execute immediately on page load
    fetchLiveLeads();
    setInterval(fetchLiveLeads, 60000);
</script>
